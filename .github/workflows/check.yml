name: Hefwonen check

on:
  schedule:
    # Elke 5 min (openbare repo = onbeperkt gratis Actions-minuten).
    # GitHub start geplande runs soms een paar minuten later dan gepland.
    # GitHub start geplande runs in de praktijk vaak een paar minuten later.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run, test-alarm of test-normal"
        default: run
        type: choice
        options: [run, test-alarm, test-normal]

permissions:
  contents: write

concurrency:
  group: hefwonen-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check huuraanbod
        run: node src/main.ts "${{ inputs.mode || 'run' }}"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POSTCODE_ALARM: "3085"
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "state: update"
          git pull --rebase -q && git push -q
